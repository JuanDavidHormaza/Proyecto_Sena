<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="senaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39A900"/>
      <stop offset="60%" stop-color="#2D8A00"/>
      <stop offset="100%" stop-color="#1F4E78"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#001824" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo institucional redondeado con gradiente SENA -->
  <rect width="128" height="128" rx="28" fill="url(#senaBg)"/>
  
  <!-- Borde sutil de brillo -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Isotipo institucional SENA estilizado en blanco -->
  <g fill="#ffffff" filter="url(#badgeShadow)">
    <!-- Cabeza circular del aprendiz -->
    <circle cx="64" cy="34" r="11"/>

    <!-- Rayo/brazo izquierdo ascendente -->
    <path d="M42 96 L42 70 L52 56 L60 70 L52 96 Z"/>

    <!-- Rayo/brazo derecho ascendente -->
    <path d="M86 96 L86 70 L76 56 L68 70 L76 96 Z"/>

    <!-- Cuerpo y antorcha central -->
    <path d="M59 96 L69 96 L66 61 L62 61 Z"/>

    <!-- Base horizontal institucional -->
    <rect x="36" y="99" width="56" height="6" rx="3"/>
  </g>
</svg>