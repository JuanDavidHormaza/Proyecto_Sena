services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: worklex_auth

    environment:
      KEYCLOAK_USER: ${KEYCLOAK_USER:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD:-Admin123*}
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-Admin123*}

    command: start-dev

    ports:
      - "8080:8080"

    networks:
      - worklex_network

networks:
  worklex_network:
    external: true