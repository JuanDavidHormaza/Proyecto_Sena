upstream worklex_backend {
    server worklex_backend:8000;
}

upstream worklex_frontend {
    server worklex_frontend:5173;
}

upstream worklex_minio {
    server minio:9000;
}

upstream worklex_minio_console {
    server minio:9001;
}

# ── Servidor HTTP (Puerto 80) ───────────────────────────────────────────────
server {
    listen 80;
    server_name localhost 127.0.0.1 worklex.sena.edu.co _;

    # Desafío Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API de MinIO S3
    location /minio/ {
        proxy_pass http://worklex_minio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Consola Web de MinIO
    location /minio-console/ {
        proxy_pass http://worklex_minio_console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Buckets multimedia directos de MinIO
    location ~ ^/(dictionary-images|dictionary-audios|dictionary-videos|exam-audios|exam-submissions)/ {
        proxy_pass http://worklex_minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de Evaluación Fonética (Speaking Audio) - Bypass WAF para multipart/form-data
    location /api/exam/evaluate-speaking/ {
        modsecurity off;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_pass http://worklex_backend/api/exam/evaluate-speaking/;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/exam/evaluate-speaking {
        modsecurity off;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_pass http://worklex_backend/api/exam/evaluate-speaking/;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/exam/speaking/ {
        modsecurity off;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_pass http://worklex_backend/api/exam/speaking/;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST de Django Backend
    location /api/ {
        proxy_pass http://worklex_backend/api/;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }

    # Panel Administrativo de Django
    location /admin/ {
        proxy_pass http://worklex_backend/admin/;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA y Vite HMR (WebSocket)
    location / {
        proxy_pass http://worklex_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── Servidor HTTPS (Puerto 443) ──────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name localhost 127.0.0.1 worklex.sena.edu.co _;

    ssl_certificate /etc/letsencrypt/live/worklex.sena.edu.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worklex.sena.edu.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API de MinIO S3
    location /minio/ {
