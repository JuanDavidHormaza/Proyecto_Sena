# WorkLex SENA - ModSecurity Overrides & Tuning
# Exclusión obligatoria para peticiones multipart/form-data de audio (WebM/WAV)
SecRuleRemoveById 200003

# Desactivar inspección WAF de body para peticiones de audio fonético
SecRule REQUEST_URI "@beginsWith /api/exam/evaluate-speaking" "id:10003,phase:1,pass,nolog,ctl:ruleEngine=Off,ctl:requestBodyAccess=Off,ctl:ruleRemoveById=200003"
SecRule REQUEST_URI "@beginsWith /api/exam/speaking" "id:10004,phase:1,pass,nolog,ctl:ruleEngine=Off,ctl:requestBodyAccess=Off,ctl:ruleRemoveById=200003"

# Permite peticiones de API legítimas de WorkLex evitando falsos positivos por User-Agent o anomaly score en auth
SecRule REQUEST_URI "@beginsWith /api/" "id:10001,phase:1,pass,nolog,ctl:ruleRemoveById=949110,ctl:ruleRemoveById=980130,ctl:ruleRemoveById=920280,ctl:ruleRemoveById=920300,ctl:ruleRemoveById=920320,ctl:ruleRemoveById=920350,ctl:ruleRemoveById=200003"
SecRule REQUEST_URI "@beginsWith /minio" "id:10002,phase:1,pass,nolog,ctl:ruleRemoveById=949110,ctl:ruleRemoveById=980130"
