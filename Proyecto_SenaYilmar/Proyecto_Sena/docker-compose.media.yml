services:
  worklex_minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: worklex_minio
    hostname: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-Admin123*}
    volumes:
      - minio_data:/data
    networks:
      worklex_network:
        aliases:
          - minio

volumes:
  minio_data:

networks:
  worklex_network:
    external: true
