SecRule REQUEST_URI "@beginsWith /api/" "id:10001,phase:1,pass,nolog,ctl:ruleRemoveById=949110,ctl:ruleRemoveById=980130,ctl:ruleRemoveById=920280,ctl:ruleRemoveById=920300,ctl:ruleRemoveById=920320,ctl:ruleRemoveById=920350"
SecRule REQUEST_URI "@beginsWith /minio" "id:10002,phase:1,pass,nolog,ctl:ruleRemoveById=949110,ctl:ruleRemoveById=980130"
