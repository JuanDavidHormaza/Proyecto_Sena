# ==============================================================================
# WorkLex SENA - Configuración Nginx Reverse Proxy & SSL (proxy.conf)
# Dominio: https://worklexsena.shop
# ==============================================================================

upstream worklex_backend {
    server worklex_backend:8000;
}

upstream worklex_frontend {
    server worklex_frontend:5173;
}

upstream worklex_minio {
    server worklex_minio:9000;
}

upstream worklex_minio_console {
    server worklex_minio:9001;
}

# ── Redirección Permanente HTTP (Puerto 80) a HTTPS (Puerto 443) ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name worklexsena.shop www.worklexsena.shop localhost 127.0.0.1 _;

    # Desafío Let's Encrypt / Certbot para renovación automática
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección 301 global a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Servidor Seguro HTTPS (Puerto 443) ────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name worklexsena.shop www.worklexsena.shop localhost 127.0.0.1 _;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/worklexsena.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worklexsena.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeceras de Seguridad y HSTS (Habilita APIs de audio y micrófono en navegadores)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    # S3 MinIO Storage API
    location /minio/ {
        proxy_pass http://worklex_minio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Consola Web de Administración MinIO
    location /minio-console/ {
        proxy_pass http://worklex_minio_console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Proxy directo para buckets multimedia
    location ~ ^/(dictionary-images|dictionary-audios|dictionary-videos|exam-audios|exam-submissions)/ {
        proxy_pass http://worklex_minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de Evaluación de Speaking (Audio) - Bypass WAF
    location /api/exam/evaluate-speaking/ {
        modsecurity off;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_pass http://worklex_backend/api/exam/evaluate-speaking/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /api/exam/evaluate-speaking {
        modsecurity off;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_pass http://worklex_backend/api/exam/evaluate-speaking/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/exam/speaking/ {
        modsecurity off;
        client_max_body_size 50M;
        proxy_request_buffering off;
        proxy_pass http://worklex_backend/api/exam/speaking/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # ── Backend Django REST Framework (Cabeceras anti-403 Origin Checking Failed) ──
    location /api/ {
        proxy_pass http://worklex_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        client_max_body_size 500M;
    }

    location /admin/ {
        proxy_pass http://worklex_backend/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Archivos estáticos de Django
    location /static/ {
        proxy_pass http://worklex_backend/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend React SPA ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://worklex_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
