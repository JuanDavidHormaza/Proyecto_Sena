services:

  worklex_persistencia:

    image: postgres:16-alpine

    container_name: worklex_persistencia

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SENA}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin123*}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # Persistencia de datos
      - worklex_data:/var/lib/postgresql/data

      # Scripts automáticos de inicialización y carga de vocabulario ADSO
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

      # Configuración personalizada
      - ./postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/conf/custom.conf:/etc/postgresql/custom.conf:ro

    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-SENA}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - worklex_network

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          memory: 128M

volumes:
  worklex_data:

networks:
  worklex_network:
    name: worklex_network
    driver: bridge