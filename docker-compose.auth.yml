services:
  worklex_auth_keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: worklex_auth_keycloak

    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}

    command: start-dev

    expose:
      - "8080"

    networks:
      - worklex_app_network

networks:
  worklex_app_network:

