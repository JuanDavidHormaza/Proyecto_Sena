services:

  # ─────────────────────────────────────────────────────────────────────────
  # worklex_media (MinIO)
  # Almacenamiento de objetos S3-compatible para TODO el contenido multimedia
  # del diccionario (imágenes, audios, videos) y las grabaciones de speaking
  # de los estudiantes. Reemplaza a Supabase Storage.
  #
  # Jerarquía dentro de cada bucket: {programa}/{ficha}/{archivo}
  #   worklex-images  -> imágenes del diccionario
  #   worklex-audios  -> audios del diccionario
  #   worklex-videos  -> videos del diccionario
  #   student-speaking -> grabaciones de pronunciación del quiz
  # ─────────────────────────────────────────────────────────────────────────
  worklex-media:

    image: minio/minio:latest

    container_name: worklex-media

    restart: unless-stopped

    env_file:
      - .env

    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web de administración

    volumes:
      - worklex_media_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - worklex_network

volumes:
  worklex_media_data:

networks:
  worklex_network:
    external: true
