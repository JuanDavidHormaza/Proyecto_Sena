services:
  worklex_media_MinIO:
    image: minio/minio:latest
    container_name: worklex_media_MinIO

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # Si la consola vive detrás de un reverse proxy:
      MINIO_BROWSER_REDIRECT_URL: https://minio.tudominio.com

      # Solo si expondrás la API bajo otro hostname público:
      # MINIO_SERVER_URL está deprecada, evita usarla.
      # MINIO_SERVER_URL: https://minio-api.tudominio.com

    volumes:
      - media_data:/data:rw
    
    # En producción, idealmente NO publiques estos puertos al host.
    # Si administras con reverse proxy, deja solo la red interna.
    expose:
      - "9000"
      - "9001"

    healthcheck:
      #test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - worklex_data_network

    security_opt:
      - no-new-privileges:true

    read_only: false

volumes:
  media_data:

networks:
  worklex_data_network:
    external: true
    name: worklex_data_network
