services:

  worklex_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: worklex_backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    working_dir: /app

    #-------------------------------------------------------------------------
    # Ajuste para evitar error por permisos con chmod
    #-------------------------------------------------------------------------
    #       python manage.py runserver 0.0.0.0:8000 &&

    depends_on:
      - worklex_persistencia

    command: >
      sh -c "
      echo 'Esperando que PostgreSQL este listo en worklex_persistencia:5432...' &&
      until python -c \"import socket; s = socket.socket(); s.connect(('worklex_persistencia', 5432)); s.close()\" 2>/dev/null; do
        sleep 1
      done &&
      echo 'PostgreSQL listo. Aplicando migraciones...' &&
      python manage.py migrate --fake-initial &&
      echo 'Precargando vocabulario tecnico ADSO en la base de datos...' &&
      (python manage.py import_adso_dictionary || python manage.py seed_adso_dictionary) &&
      python manage.py create_superadmin || true &&
      (python manage.py upload_adso_assets || true) &&
      echo 'Iniciando servidor Gunicorn...' &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      "

    # Permite que otros contenedores esperen a que PostgreSQL esté listo.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      #test: ["CMD","curl","-f","http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - worklex_network



  worklex_frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: worklex_frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      - BACKEND_URL=http://worklex_backend:8000

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    working_dir: /app

    command: npm run dev -- --host 0.0.0.0

    # Permite que otros contenedores esperen a que PostgreSQL esté listo.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      #test: ["CMD","curl","-f","http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - worklex_network

  worklex_proxy:

    image: owasp/modsecurity-crs:nginx

    container_name: worklex_proxy

    depends_on:
      - worklex_backend
      - worklex_frontend

    networks:
      - worklex_network


networks:
  worklex_network:
    external: true
    #driver: bridge

volumes:
  frontend_node_modules: