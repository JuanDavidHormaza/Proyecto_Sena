services:

  worklex_app_backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: worklex_app_backend

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - ./backend:/app:rw
      - backend_static:/app/staticfiles
      - backend_media:/app/media

    working_dir: /app

    command: >
      sh -c "
      python manage.py migrate --fake-initial &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    depends_on:
      worklex_persistencia:
        condition: service_healthy
      worklex_media_MinIO:
        condition: service_healthy

    networks:
      # El Back-End no necesita conectarse a la red pública, enlaza a los demás
      # contenedores por la red privada mediante Bridge.
      #- worklex_private_network
      - worklex_app_network
      - worklex_data_network

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp

  worklex_app_frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: worklex_app_frontend

    restart: unless-stopped

    expose:
      - "5173"

    volumes:
      - ./frontend:/app:rw
      - frontend_node_modules:/app/node_modules

    working_dir: /app

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      worklex_app_backend:
        condition: service_started

    # Permite que otros contenedores esperen a que PostgreSQL esté listo.
    healthcheck:
      #test: ["CMD-SHELL", "curl -fsS http://localhost:5173 || exit 1"]
      test: ["CMD","curl","-f","http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      # Red para exponer NGINX al exterior y conectarlo con el frontend
      # El Front-End necesita conectarse a la red pública
      #- worklex_public_network
      - worklex_app_network

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp

networks:
  worklex_edge_network:
    driver: bridge
    name: worklex_edge_network

  worklex_app_network:
    driver: bridge
    name: worklex_app_network
    internal: true

  worklex_data_network:
    driver: bridge
    name: worklex_data_network
    internal: true


volumes:
  frontend_node_modules:
  backend_static:
  backend_media: